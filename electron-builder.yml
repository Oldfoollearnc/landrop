appId: com.nearsend.app
productName: NearSend
copyright: NearSend

directories:
  output: dist
  buildResources: assets

electronDist: node_modules/electron/dist
npmRebuild: false

files:
  - package.json
  - src/**/*
  - assets/**

asar: true

win:
  icon: assets/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: NearSend-${version}-Portable.exe
  unpackDirName: NearSend

nsis:
  artifactName: NearSend-${version}-Setup.exe
  oneClick: true
  perMachine: false
  allowElevation: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: assets/installer.nsh
