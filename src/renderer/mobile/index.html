<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>近传</title>
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/icon.png">
<link rel="stylesheet" href="/m/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="peer-wrap">
      <div class="peer-line">
        <span class="peer" id="peer">电脑</span>
      </div>
      <div class="status">
        <i class="dot" id="dot"></i>
        <span id="conn">连接中…</span>
      </div>
    </div>
    <div class="tools">
      <button class="tool" id="btnSearch" aria-label="搜索聊天记录" title="搜索">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.2 4.2"/>
        </svg>
      </button>
      <button class="tool" id="btnMore" aria-label="更多" title="更多">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5.4" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="18.6" r="1.8"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="offline" id="offline" hidden>
    <span id="offlineText">连接断开，正在重连…</span>
    <button id="offlineRetry">立即重连</button>
  </div>

  <main class="chat" id="chat"></main>

  <button class="jump" id="jump" hidden>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v13M5.6 12.4L12 18.8l6.4-6.4"/>
    </svg>
    <b id="jumpCount">1</b> 条新消息
  </button>

  <div class="replybar" id="replyBar" hidden>
    <i class="rline"></i>
    <div class="rtxt"><b id="replyName">回复</b> <span id="replyText"></span></div>
    <button id="replyClose" aria-label="取消回复">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <footer class="composer" id="composer">
    <button class="round" id="plus" aria-label="发送图片或文件">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <div class="box">
      <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    </div>
    <button class="round send" id="send" disabled aria-label="发送">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h12M12.6 6.4L18.2 12l-5.6 5.6"/>
      </svg>
    </button>
  </footer>

  <div class="selbar" id="selBar" hidden>
    <span class="count">已选 <b id="selCount">0</b> 条</span>
    <button id="selCancel">取消</button>
    <button class="danger" id="selDelete">删除</button>
  </div>

  <div class="search" id="searchWrap" hidden>
    <button class="tool" id="searchBack" aria-label="关闭搜索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 5.5L8 12l6.5 6.5"/>
      </svg>
    </button>
    <div class="field">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.2 4.2"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索文字和文件名" enterkeyhint="search" autocomplete="off">
    </div>
    <span class="nav" id="searchCount">0/0</span>
    <button class="step" id="searchPrev" aria-label="上一个">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 14.5l6-6 6 6"/>
      </svg>
    </button>
    <button class="step" id="searchNext" aria-label="下一个">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9.5l6 6 6-6"/>
      </svg>
    </button>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<div class="sheet-wrap" id="attachWrap" hidden>
  <div class="sheet attach" id="attach"></div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-top">
    <span class="idx" id="viewerIdx"></span>
    <button id="viewerShare">分享</button>
    <button id="viewerSave">保存</button>
    <button id="viewerClose">关闭</button>
  </div>
  <div class="viewer-stage" id="viewerStage">
    <img id="viewerImg" alt="图片预览">
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="fileInput" multiple hidden>

<script src="/m/app.js"></script>
</body>
</html>
