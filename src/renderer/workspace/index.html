<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>近传 · 远程工位</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">近</span>
      <span class="brand-text">近传 <b>·</b> 远程工位</span>
    </div>

    <nav class="nav-rail top-nav" id="navRail" aria-label="主导航">
      <div class="nav-main">
        <button class="nav-item active" data-view="devices" type="button">
          <span class="nav-ico" data-icon="monitor"></span>
          <span class="nav-label">设备</span>
          <span class="nav-badge" hidden></span>
        </button>
        <button class="nav-item" data-view="sessions" type="button">
          <span class="nav-ico" data-icon="play"></span>
          <span class="nav-label">会话</span>
        </button>
        <button class="nav-item" data-view="messages" type="button">
          <span class="nav-ico" data-icon="chat"></span>
          <span class="nav-label">消息</span>
          <span class="nav-badge" id="navUnread" hidden></span>
        </button>
        <button class="nav-item" data-view="grants" type="button">
          <span class="nav-ico" data-icon="shield"></span>
          <span class="nav-label">授权</span>
        </button>
        <button class="nav-item" data-view="audit" type="button">
          <span class="nav-ico" data-icon="list"></span>
          <span class="nav-label">审计</span>
        </button>
        <button class="nav-item" data-view="diagnostics" type="button">
          <span class="nav-ico" data-icon="activity"></span>
          <span class="nav-label">诊断</span>
        </button>
      </div>
    </nav>

    <button class="global-search" id="globalSearch" type="button" aria-label="搜索设备或命令">
      <span class="gs-icon" aria-hidden="true"></span>
      <span class="gs-text">搜索设备或命令</span>
      <kbd>Ctrl K</kbd>
    </button>

    <span class="top-net" title="局域网直连"><i class="status-dot online"></i>局域网</span>

    <div class="top-actions">
      <button class="nav-item top-settings" data-view="settings" type="button" title="设置" aria-label="设置">
        <span class="nav-ico" data-icon="settings"></span>
      </button>
      <button class="icon-btn" id="btnAgentPreview" type="button" title="本机被控" aria-label="本机被控"></button>
      <button class="icon-btn" id="btnTheme" type="button" title="切换主题" aria-label="切换主题"></button>
      <div class="window-controls" aria-label="窗口控制">
        <button class="window-btn" id="winMin" type="button" title="最小化" aria-label="最小化"><span data-icon="minus"></span></button>
        <button class="window-btn" id="winMax" type="button" title="最大化" aria-label="最大化"><span data-icon="square"></span></button>
        <button class="window-btn danger" id="winClose" type="button" title="关闭到托盘" aria-label="关闭到托盘"><span data-icon="x"></span></button>
      </div>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
<div id="modalRoot"></div>
<div id="drawerRoot"></div>
<div id="commandRoot"></div>
<div id="sessionRoot"></div>
<div id="agentRoot"></div>

<script src="app.js"></script>
</body>
</html>
